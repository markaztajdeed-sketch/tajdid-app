  <script>
    try { var t = JSON.parse(localStorage.getItem('tajdid_theme')) || 'light'; } catch (e) { var t = 'light'; }
    document.documentElement.dataset.theme = t;
    if (t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('is-dark');
  </script>
